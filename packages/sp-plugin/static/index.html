<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>像素远征</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#231942;--ink:#231942;--purple:#6b35ff;--pink:#ff3f77;--cyan:#20ddff;--yellow:#ffdd38;--panel:#fff8df;--edge:#2d1855}*{box-sizing:border-box}body{margin:0;background:#231942;color:var(--ink);min-width:280px}.app{min-height:100vh;background:linear-gradient(#35c9ff 0 36%,#8ee95a 36% 100%);padding-bottom:70px}.hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:9px 10px;background:#33166f;color:#fff;border-bottom:4px solid #1b0b42;box-shadow:0 3px 0 #ff3f77}.logo{font-weight:1000;letter-spacing:1px;text-shadow:2px 2px #ff3f77;margin-right:auto}.pill{background:#5d2bd2;border:2px solid #fff;border-radius:4px;padding:4px 7px;font-size:12px;font-weight:900;box-shadow:2px 2px #1b0b42}.scene{position:relative;height:250px;overflow:hidden;background:linear-gradient(#21c9ff 0 66%,#70e457 66%);border-bottom:5px solid #2d1855}.sun{position:absolute;right:22px;top:20px;width:52px;height:52px;background:var(--yellow);border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 4px #ff8b24}.cloud,.cloud:before,.cloud:after{position:absolute;background:#fff;border:3px solid #612da7}.cloud{width:58px;height:20px;top:45px;left:15px}.cloud:before,.cloud:after{content:"";bottom:-3px}.cloud:before{width:25px;height:28px;left:8px}.cloud:after{width:22px;height:20px;left:31px}.far{position:absolute;left:-5%;right:-5%;bottom:70px;height:65px;background:#b5ff61;clip-path:polygon(0 100%,0 55%,12% 20%,27% 70%,43% 8%,62% 72%,79% 28%,100% 65%,100% 100%);border-bottom:5px solid #3da745}.ground{position:absolute;left:0;right:0;bottom:0;height:72px;background:repeating-linear-gradient(90deg,#d36b35 0 30px,#f08b3a 30px 60px);border-top:8px solid #49b83e}.ground:after{content:"";position:absolute;inset:12px 0 auto;height:6px;background:repeating-linear-gradient(90deg,#5e2e48 0 6px,transparent 6px 12px)}.hero-pixel{position:absolute;left:16%;bottom:64px;width:58px;height:76px;filter:drop-shadow(5px 5px #4b216e);animation:bob 1.2s steps(2) infinite}.hero-pixel .head{position:absolute;left:8px;top:7px;width:42px;height:38px;background:#ffd3a5;border:5px solid #39165d;border-radius:12px}.hero-pixel .hair{position:absolute;left:4px;top:0;width:50px;height:22px;background:#ff477e;border:5px solid #39165d}.hero-pixel .eye{position:absolute;top:21px;width:5px;height:8px;background:#231942}.hero-pixel .eye.l{left:19px}.hero-pixel .eye.r{right:19px}.hero-pixel .body{position:absolute;left:11px;top:43px;width:37px;height:30px;background:#6b35ff;border:5px solid #39165d}.hero-pixel .accessory{display:none;position:absolute;z-index:5}.hero-pixel.sun-band .accessory{display:block;left:4px;top:9px;width:50px;height:7px;background:#ffdf3d;border:3px solid #39165d}.hero-pixel.sky-goggles .accessory{display:block;left:8px;top:21px;width:42px;height:12px;border:4px solid #20ddff}.hero-pixel.berry-cape:after{content:"";position:absolute;left:3px;top:46px;width:52px;height:31px;background:#ff3f77;border:5px solid #39165d;z-index:-1}.boss{position:absolute;right:13%;bottom:64px;width:86px;height:78px;background:#32d66a;border:6px solid #351650;border-radius:42% 42% 16% 16%;filter:drop-shadow(6px 6px #582262);animation:boss 1.8s steps(2) infinite}.boss:before,.boss:after{content:"";position:absolute;top:-20px;width:18px;height:28px;background:#ffe83b;border:5px solid #351650}.boss:before{left:8px;transform:rotate(-20deg)}.boss:after{right:8px;transform:rotate(20deg)}.boss .eyes{position:absolute;left:19px;right:19px;top:28px;height:9px;border-left:9px solid #351650;border-right:9px solid #351650}.boss-card{position:absolute;right:7px;bottom:6px;width:53%;max-width:210px;padding:5px 7px;background:#fff8df;border:4px solid #351650;box-shadow:4px 4px #ff3f77;font-size:11px;font-weight:900}.bar{height:10px;background:#351650;padding:2px;margin-top:4px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff3f77,#ff8b24);width:100%}@keyframes bob{50%{transform:translateY(-4px)}}@keyframes boss{50%{transform:translateX(-4px)}}
    .content{padding:10px}.card{background:var(--panel);border:4px solid var(--edge);box-shadow:5px 5px #ff3f77;margin:0 0 12px;padding:12px}.card h2{font-size:15px;margin:0 0 10px;text-transform:uppercase}.xp{height:16px;background:#2d1855;padding:3px;margin-top:7px}.xp i{display:block;height:100%;background:linear-gradient(90deg,#20ddff,#89ff45);width:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.metric{background:#fff;border:3px solid #2d1855;text-align:center;padding:6px 2px;font-size:10px}.metric b{display:block;font-size:15px}.quest{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;margin:8px 0}.quest progress{grid-column:1/-1;width:100%;accent-color:#6b35ff}.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.item{background:#fff;border:3px solid #2d1855;padding:8px;text-align:center}.item-icon{width:45px;height:45px;margin:auto;display:grid;place-items:center;background:#20ddff;border:3px solid #2d1855;font-size:24px}.item strong,.item small{display:block;margin-top:5px}button{font:inherit;font-weight:900;color:#fff;background:#6b35ff;border:3px solid #2d1855;padding:7px 9px;box-shadow:2px 2px #2d1855;cursor:pointer}button:active{transform:translate(2px,2px);box-shadow:none}button.alt{background:#ff3f77}button.gold{background:#e58b00}button:disabled{filter:grayscale(1);opacity:.6}.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#32176b;border-top:4px solid #1b0b42}.tabs button{border:0;border-right:1px solid #5936a0;box-shadow:none;padding:9px 2px;font-size:10px;background:transparent}.tabs button.active{background:#ff3f77}.page{display:none}.page.active{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form label{font-size:11px;font-weight:900}.form input,.form select{display:block;width:100%;margin-top:4px;border:3px solid #2d1855;background:#fff;padding:7px;color:#231942}.wide{grid-column:1/-1}.status{padding:8px;background:#fff;border:3px solid #2d1855;font-size:11px;overflow-wrap:anywhere}.connected{color:#08773a}.disconnected{color:#bb174b}.rank{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:7px;border-bottom:2px dashed #a78bc7}.debug{margin-top:12px}.debug summary{cursor:pointer;font-weight:900}.debug-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}@media(max-width:360px){.metrics{grid-template-columns:1fr 1fr}.hero-pixel{left:8%}.boss{right:7%}}
  </style>
</head>
<body><main class="app">
  <header class="hud"><span class="logo" data-t="title">像素远征</span><span class="pill" id="level">Lv.1</span><span class="pill">🪙 <b id="coins">0</b></span></header>
  <section class="scene"><div class="sun"></div><div class="cloud"></div><div class="far"></div><div class="hero-pixel" id="hero"><i class="hair"></i><i class="head"></i><i class="eye l"></i><i class="eye r"></i><i class="body"></i><i class="accessory"></i></div><div class="boss"><i class="eyes"></i></div><div class="ground"></div><div class="boss-card"><span id="stage">第 1 关</span> · <span id="boss-name">苔甲兽</span><div class="bar"><i id="boss-hp"></i></div><span id="boss-hp-label">80 / 80 HP</span></div></section>
  <div class="content">
    <section class="page active" data-page="adventure"><div class="card"><h2 data-t="progress">冒险进度</h2><div><b id="xp-label">0 / 125 XP</b><div class="xp"><i id="xp"></i></div></div></div><div class="card metrics"><div class="metric"><span data-t="streak">连续</span><b id="streak">0</b></div><div class="metric"><span data-t="today">今日</span><b id="today">0</b></div><div class="metric"><span data-t="tasks">总任务</span><b id="total-tasks">0</b></div><div class="metric"><span data-t="focus">专注</span><b id="focus">0m</b></div></div><div class="card"><h2 data-t="connection">桌宠连接</h2><div class="status" id="bridge-status">正在连接 localhost…</div><button id="test-bridge" style="margin-top:8px" data-t="test">重新连接</button></div></section>
    <section class="page" data-page="quests"><div class="card"><h2 data-t="daily">今日委托</h2><div class="quest"><b data-t="qtask">完成 3 个任务</b><span>🪙15</span><progress id="q-task"></progress></div><div class="quest"><b data-t="qfocus">专注 50 分钟</b><span>🪙10</span><progress id="q-focus"></progress></div></div><div class="card"><h2 data-t="damage">战斗规则</h2><p data-t="damageHelp">每个任务造成 10 点伤害；#deep-work 为 15，#hard 为 20。标题写 [dmg:30] 可指定伤害。</p></div></section>
    <section class="page" data-page="shop"><div class="card"><h2 data-t="shop">饰品商店</h2><div class="shop" id="shop"></div></div></section>
    <section class="page" data-page="leaderboard"><div class="card"><h2 data-t="leaderboard">冒险者排行榜</h2><p data-t="rankHelp">启用后，只上传昵称和成长统计，不上传任务标题。</p><button id="rank-refresh" data-t="refresh">刷新排行榜</button><div id="rank-list" style="margin-top:8px"></div></div></section>
    <section class="page" data-page="settings"><div class="card"><h2 data-t="settings">设置</h2><div class="form"><label><span data-t="language">语言</span><select id="language"><option value="zh">中文</option><option value="en">English</option></select></label><label><span data-t="notifications">奖励提醒</span><select id="notifications"><option value="true">开启</option><option value="false">关闭</option></select></label><label>任务 XP<input id="taskXp" type="number" min="1" max="100"></label><label>任务金币<input id="taskCoins" type="number" min="1" max="100"></label><label>专注周期（分钟）<input id="focusBlockMinutes" type="number" min="5" max="120"></label><label>周期 XP<input id="focusBlockXp" type="number" min="1" max="100"></label><label class="wide"><span data-t="nickname">排行榜昵称</span><input id="nickname" maxlength="20"></label><label class="wide"><input id="leaderboardEnabled" type="checkbox" style="display:inline;width:auto"> <span data-t="rankEnable">启用排行榜同步</span></label><button class="wide" id="save-settings" data-t="save">保存设置</button></div><p class="status" id="settings-status"></p><details class="debug"><summary data-t="debug">开发调试区</summary><div class="debug-grid"><button data-action="debugAddXp">+10 XP</button><button data-action="debugAddCoins">+5 coins</button><button data-action="debugCompleteTask" data-t="simulate">模拟完成任务</button><button data-action="resetState" class="alt" data-t="reset">重置状态</button></div></details></div></section>
  </div>
  <nav class="tabs"><button class="active" data-tab="adventure">🗺️<br><span data-t="tabAdventure">冒险</span></button><button data-tab="quests">📜<br><span data-t="tabQuest">委托</span></button><button data-tab="shop">🎒<br><span data-t="tabShop">商店</span></button><button data-tab="leaderboard">🏆<br><span data-t="tabRank">排行</span></button><button data-tab="settings">⚙️<br><span data-t="tabSettings">设置</span></button></nav>
</main><script>
const $=id=>document.getElementById(id);let model=null;
const text={zh:{title:'像素远征',progress:'冒险进度',streak:'连续',today:'今日',tasks:'总任务',focus:'专注',connection:'桌宠连接',test:'重新连接',daily:'今日委托',qtask:'完成 3 个任务',qfocus:'专注 50 分钟',damage:'战斗规则',damageHelp:'每个任务造成 10 点伤害；#deep-work 为 15，#hard 为 20。标题写 [dmg:30] 可指定伤害。',shop:'饰品商店',leaderboard:'冒险者排行榜',rankHelp:'启用后，只上传昵称和成长统计，不上传任务标题。',refresh:'刷新排行榜',settings:'设置',language:'语言',notifications:'奖励提醒',nickname:'排行榜昵称',rankEnable:'启用排行榜同步',save:'保存设置',debug:'开发调试区',simulate:'模拟完成任务',reset:'重置状态',tabAdventure:'冒险',tabQuest:'委托',tabShop:'商店',tabRank:'排行',tabSettings:'设置'},en:{title:'PIXEL QUEST',progress:'Adventure Progress',streak:'Streak',today:'Today',tasks:'Tasks',focus:'Focus',connection:'Pet Connection',test:'Reconnect',daily:'Daily Quests',qtask:'Complete 3 tasks',qfocus:'Focus for 50 minutes',damage:'Battle Rules',damageHelp:'Tasks deal 10 damage; #deep-work deals 15 and #hard 20. Add [dmg:30] to a title for explicit damage.',shop:'Accessory Shop',leaderboard:'Adventurer Rankings',rankHelp:'Only nickname and game stats are uploaded. Task titles stay local.',refresh:'Refresh',settings:'Settings',language:'Language',notifications:'Reward reminders',nickname:'Leaderboard nickname',rankEnable:'Enable leaderboard sync',save:'Save settings',debug:'Developer tools',simulate:'Simulate task',reset:'Reset state',tabAdventure:'Quest',tabQuest:'Daily',tabShop:'Shop',tabRank:'Ranks',tabSettings:'Settings'}};
function sendMessage(type,payload={}){return new Promise((resolve,reject)=>{const messageId=crypto.randomUUID();const timeout=setTimeout(()=>{window.removeEventListener('message',handler);reject(new Error('插件响应超时 / Plugin timeout'))},8000);const handler=e=>{if(e.source!==window.parent||e.data?.type!=='PLUGIN_MESSAGE_RESPONSE'||e.data?.messageId!==messageId)return;clearTimeout(timeout);window.removeEventListener('message',handler);resolve(e.data.result)};window.addEventListener('message',handler);window.parent.postMessage({type:'PLUGIN_MESSAGE',message:{type,...payload},messageId},'*')})}
function applyLanguage(lang){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.querySelectorAll('[data-t]').forEach(el=>{const value=text[lang]?.[el.dataset.t];if(value)el.textContent=value})}
function renderShop(){const s=model.state,cfg=model.settings,lang=cfg.language;$('shop').innerHTML='';for(const item of model.shopItems){const owned=s.inventory.includes(item.id),equipped=s.equippedAccessory===item.id;const card=document.createElement('div');card.className='item';card.innerHTML=`<div class="item-icon" style="background:${item.color}">${item.icon}</div><strong>${lang==='en'?item.nameEn:item.name}</strong><small>🪙 ${item.price}</small>`;const b=document.createElement('button');b.style.marginTop='7px';b.textContent=equipped?(lang==='en'?'Equipped':'已装备'):owned?(lang==='en'?'Equip':'装备'):(lang==='en'?'Buy':'购买');b.disabled=equipped||(!owned&&s.coins<item.price);b.onclick=()=>act(owned?'equipItem':'purchaseItem',{itemId:item.id});card.appendChild(b);$('shop').appendChild(card)}}
function render(r){if(!r?.state)return;model=r;const s=r.state,cfg=r.settings,next=r.nextLevelXp;$('level').textContent=`Lv.${s.level}`;$('coins').textContent=s.coins;$('xp-label').textContent=`${s.xp} / ${next} XP`;$('xp').style.width=`${Math.min(100,s.xp/next*100)}%`;$('streak').textContent=s.streak;$('today').textContent=s.today.tasksCompleted;$('total-tasks').textContent=s.totalTasksCompleted;$('focus').textContent=`${s.totalFocusMinutes}m`;$('stage').textContent=cfg.language==='en'?`Stage ${s.adventure.stage}`:`第 ${s.adventure.stage} 关`;$('boss-name').textContent=s.adventure.boss.name;$('boss-hp-label').textContent=`${s.adventure.boss.hp} / ${s.adventure.boss.maxHp} HP`;$('boss-hp').style.width=`${s.adventure.boss.hp/s.adventure.boss.maxHp*100}%`;$('hero').className=`hero-pixel ${s.equippedAccessory||''}`;$('q-task').max=s.dailyQuests.tasks.target;$('q-task').value=Math.min(s.dailyQuests.tasks.progress,s.dailyQuests.tasks.target);$('q-focus').max=s.dailyQuests.focus.target;$('q-focus').value=Math.min(s.dailyQuests.focus.progress,s.dailyQuests.focus.target);const connected=r.bridge.status==='connected';$('bridge-status').className=`status ${connected?'connected':'disconnected'}`;$('bridge-status').textContent=connected?`✓ ${cfg.language==='en'?'Pet connected':'桌宠已连接'} · ${r.bridge.url}`:`● ${cfg.language==='en'?'Pet not running; start it and retry':'桌宠未运行，请启动后重试'} · ${r.bridge.url}`;for(const id of ['language','taskXp','taskCoins','focusBlockMinutes','focusBlockXp'])$(id).value=cfg[id];$('notifications').value=String(cfg.notifications);$('nickname').value=cfg.leaderboardNickname;$('leaderboardEnabled').checked=cfg.leaderboardEnabled;applyLanguage(cfg.language);renderShop()}
async function refresh(){try{render(await sendMessage('getState'))}catch(e){$('bridge-status').textContent=e.message}}
async function act(type,payload={}){const r=await sendMessage(type,payload);if(!r?.ok)throw new Error(r?.error||'操作失败');render(r);return r}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===b.dataset.tab))};
$('test-bridge').onclick=()=>act('testBridge').catch(e=>$('bridge-status').textContent=e.message);
$('save-settings').onclick=async()=>{const settings={language:$('language').value,notifications:$('notifications').value==='true',taskXp:Number($('taskXp').value),taskCoins:Number($('taskCoins').value),focusBlockMinutes:Number($('focusBlockMinutes').value),focusBlockXp:Number($('focusBlockXp').value),leaderboardNickname:$('nickname').value,leaderboardEnabled:$('leaderboardEnabled').checked};try{await act('saveSettings',{settings});$('settings-status').textContent=settings.language==='en'?'Saved':'已保存';if(settings.leaderboardEnabled)await sendMessage('submitLeaderboard')}catch(e){$('settings-status').textContent=e.message}};
document.querySelector('.debug-grid').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='resetState'&&!confirm('确定重置全部成长状态吗？'))return;b.disabled=true;try{await act(b.dataset.action)}catch(err){$('settings-status').textContent=err.message}finally{b.disabled=false}};
$('rank-refresh').onclick=async()=>{const list=$('rank-list');list.textContent='…';const r=await sendMessage('getLeaderboard');if(!r?.ok){list.textContent=`暂时无法连接：${r?.error||'unknown'}`;return}const entries=r.leaderboard?.entries||r.leaderboard||[];list.innerHTML='';entries.slice(0,20).forEach((x,i)=>{const row=document.createElement('div');row.className='rank';row.innerHTML=`<b>#${i+1}</b><span></span><b>Lv.${Number(x.level)||1}</b>`;row.children[1].textContent=String(x.nickname||'Adventurer');list.appendChild(row)});if(!entries.length)list.textContent='暂无数据'};
PluginAPI.registerHook(PluginAPI.Hooks.PERSISTED_DATA_CHANGED,refresh);PluginAPI.registerHook(PluginAPI.Hooks.LANGUAGE_CHANGE,refresh);refresh();setInterval(refresh,5000);
</script></body></html>
