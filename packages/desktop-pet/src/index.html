<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPPet</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./archive-theme.css"><link rel="stylesheet" href="./drag.css"></head><body>
<main id="desktop" class="desktop"><div class="drag-grip" title="拖动">•••</div><div id="bubble" class="bubble"><span>等待 Super Productivity…</span></div>
  <div id="pet-zone" class="pet-zone"><div id="pet" class="pet"><i class="ear l"></i><i class="ear r"></i><div class="head"><i class="fringe"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i><i id="part" class="part"></i></div><div class="body"><i></i></div></div><div id="custom-sprite" class="custom-sprite"></div><div class="shadow"></div></div>
  <div id="context-menu" class="context-menu"><button id="open-settings">桌宠设置</button><button id="hide">隐藏</button><button id="close">退出</button></div>
  <aside id="settings-panel" class="settings-panel"><header><div><b>SPPET</b><small>DESKTOP UNIT SETTINGS</small></div><button id="settings-close">×</button></header><section><label>连接状态</label><p id="connection" class="connection">● DISCONNECTED</p><label>皮肤</label><div class="row"><button id="skin">导入 pet.json</button><button id="clear-skin">默认</button></div><label>桌宠大小 <output id="size-label">100%</output></label><input id="size" type="range" min="65" max="160" value="100"><label class="check"><input id="always-top" type="checkbox" checked> 始终置顶</label><p id="data-dir" class="path"></p></section></aside>
</main><script src="./renderer.js"></script></body></html>
