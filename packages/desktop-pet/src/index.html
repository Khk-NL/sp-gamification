<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPPet</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./archive-theme.css"><link rel="stylesheet" href="./drag.css"><link rel="stylesheet" href="./character.css"></head><body>
<main id="desktop" class="desktop"><div class="drag-grip" title="拖动">•••</div><div id="bubble" class="bubble"><span>等待 Super Productivity…</span></div>
  <div id="pet-zone" class="pet-zone"><div id="pet" class="pet"><i class="ear l"></i><i class="ear r"></i><div class="head"><i class="fringe"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i><i id="part" class="part"></i></div><div class="body"><i></i></div></div><div id="character" class="character"></div><div id="custom-sprite" class="custom-sprite"></div><div class="shadow"></div></div>
  <div id="context-menu" class="context-menu"><button id="open-chat">AI 聊天</button><button id="open-history">历史记录</button><button id="open-settings">桌宠设置</button><button id="hide">隐藏</button><button id="close">退出</button></div>
  <aside id="settings-panel" class="settings-panel overlay-panel"><header><div><b>SPPET</b><small>DESKTOP UNIT SETTINGS</small></div><button class="panel-close" id="settings-close">×</button></header><section><label>连接状态</label><p id="connection" class="connection">● DISCONNECTED</p><label>角色资源</label><select id="character-list"></select><div class="row"><button id="import-character">导入文件夹</button><button id="delete-character">删除</button></div><label>动作预览</label><div class="row"><select id="preview-state"><option value="idle">待机</option><option value="walk">行走</option><option value="sleep">睡觉</option><option value="happy">开心</option><option value="sad">难过</option><option value="angry">生气</option><option value="tired">疲惫</option><option value="eat">进食</option><option value="touch">抚摸</option><option value="battle">战斗</option><option value="victory">胜利</option><option value="defeat">失败</option><option value="talk">说话</option></select><button id="preview-character">播放</button></div><label>兼容旧皮肤</label><div class="row"><button id="skin">导入 pet.json</button><button id="clear-skin">默认</button></div><label>桌宠大小 <output id="size-label">100%</output></label><input id="size" type="range" min="65" max="160" value="100"><label class="check"><input id="always-top" type="checkbox" checked> 始终置顶</label><label class="check"><input id="gravity" type="checkbox" checked> 重力与底部站立</label><label class="check"><input id="auto-walk" type="checkbox"> 间歇行走</label><details><summary>AI 与御主档案</summary><label class="check"><input id="ai-enabled" type="checkbox"> 启用 AI（默认关闭）</label><label>接口地址<input id="ai-endpoint" type="url"></label><label>模型<input id="ai-model" type="text"></label><label>本次运行 API Key<input id="ai-key" type="password" autocomplete="off" placeholder="不会写入文件"></label><label>性格<textarea id="ai-personality"></textarea></label><label>说话方式<textarea id="ai-speaking-style"></textarea></label><label>世界观<textarea id="ai-worldview"></textarea></label><label>关系<textarea id="ai-relationship"></textarea></label><button id="save-ai">保存 AI 设置</button><label>当前 System Prompt</label><pre id="current-system-prompt" class="prompt-preview"></pre><label>用户昵称<input id="profile-nickname" type="text"></label><label>生日<input id="profile-birthday" type="date"></label><label>宠物名<input id="profile-pet-name" type="text"></label><label>用户称呼宠物<input id="profile-user-call-pet" type="text"></label><label>宠物称呼用户<input id="profile-pet-call-user" type="text"></label><label>关系档案<textarea id="profile-relationship"></textarea></label><label>自定义字段（JSON）<textarea id="profile-custom-fields">{}</textarea></label><button id="save-profile">保存御主档案</button></details><details><summary>隐私与系统感知</summary><label class="check"><input id="current-window-enabled" type="checkbox"> 允许读取当前进程和窗口标题</label><label class="check"><input id="vision-enabled" type="checkbox"> 允许我主动点击时分析一次屏幕</label><button id="save-awareness">保存授权</button><button id="read-current-window">读取一次当前窗口</button><pre id="current-window-result" class="prompt-preview">尚未读取</pre><p>窗口信息只在内存中显示，不自动写入对话，也不会自动上传。屏幕分析只在点击“看看我的屏幕”时截取一次压缩图，不保存截图。</p></details><p id="settings-message" class="panel-message"></p><p id="data-dir" class="path"></p></section></aside>
  <aside id="chat-panel" class="overlay-panel"><header><div><b>AI 聊天</b><small>LOCAL CONTEXT</small></div><button class="panel-close">×</button></header><section><div id="chat-log" class="chat-log"></div><label>消息<textarea id="chat-input" maxlength="4000"></textarea></label><div class="row"><button id="send-chat">发送</button><button id="analyze-screen">看看我的屏幕</button></div><p id="chat-message" class="panel-message"></p></section></aside>
  <aside id="history-panel" class="overlay-panel"><header><div><b>历史记录</b><small>ACTUAL LOCAL STORAGE</small></div><button class="panel-close">×</button></header><section><div id="history-list" class="history-list"></div><button id="clear-history">清空全部历史</button><p id="history-message" class="panel-message"></p></section></aside>
</main><script src="./renderer.js"></script></body></html>
